name: Corka Desktop Release

# Corka (this fork's build of Orca): tag `v<major>.<minor>.<upstream patch × 100 + build>` on `mine`,
# e.g. upstream 1.4.214 + build 1 → v1.4.21401. Builds macOS arm64 and Linux x64 and publishes one
# GitHub Release the in-app updater reads (APP_RELEASE_REPO in src/shared/release-channel.ts).
#
# The macOS job runs on a self-hosted Apple-silicon Mac registered to this repo with the label
# `corka-release-mac`; start its runner (`./run.sh` in the runner folder) before tagging. That Mac
# trusts the Corka signing certificate once, by hand, for code signing:
#   codesign -d --extract-certificates=/tmp/corka /Applications/Corka.app
#   sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain /tmp/corka0
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: corka-desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository != 'stablyai/orca'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve the Corka version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag $TAG is not v<major>.<minor>.<patch>"
            exit 1
          fi
          major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" patch="${BASH_REMATCH[3]}"
          base=$(node -p "require('./package.json').version")
          IFS=. read -r base_major base_minor base_patch <<<"$base"
          build=$((patch % 100))
          if [ "$major" != "$base_major" ] || [ "$minor" != "$base_minor" ] || [ "$((patch / 100))" != "$base_patch" ] || [ "$build" -lt 1 ]; then
            echo "::error::Tag $TAG must be v$base_major.$base_minor.$((base_patch * 100 + 1)) to v$base_major.$base_minor.$((base_patch * 100 + 99)) for upstream $base"
            exit 1
          fi
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >>"$GITHUB_OUTPUT"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "Corka $TAG" --generate-notes
          fi

  build-mac:
    needs: prepare
    # A self-hosted Mac registered with this label only; started on demand when releasing.
    # The unique label keeps every other workflow in this public repo off that machine.
    runs-on: [self-hosted, macOS, ARM64, corka-release-mac]
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      ORCA_BUILD_IDENTITY: stable
      ORCA_COMPUTER_MACOS_BUNDLE_ID: net.tnrd.corka.computer-use
      CSC_NAME: Corka Code Signing
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Locate the pinned Node runtime cache
        run: echo "ORCA_NODE_RUNTIME_CACHE_DIR=$HOME/Library/Caches/orca-node-runtime" >>"$GITHUB_ENV"

      - name: Cache the pinned Node runtime
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/orca-node-runtime
          key: orca-node-runtime-mac-${{ hashFiles('src/shared/node-runtime-pin.ts') }}

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-builder-mac-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-mac-

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      - uses: ./.github/actions/install-mobile-dependencies

      - name: Stamp the Corka version
        run: npm pkg set version="${{ needs.prepare.outputs.version }}"

      # Self-signed: the updater only needs every build signed by the same certificate.
      # The runner Mac trusts it once by hand (see the header); this step only adds a throwaway
      # keychain, and the cleanup step puts the user's keychain search list back.
      - name: Import the Corka signing certificate
        env:
          CERT_P12: ${{ secrets.CORKA_MAC_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.CORKA_MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CERT_P12" ] || [ -z "$CERT_PASSWORD" ]; then
            echo "::error::Set the CORKA_MAC_CERT_P12 and CORKA_MAC_CERT_PASSWORD secrets"
            exit 1
          fi
          keychain="$RUNNER_TEMP/corka-signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          echo "$CERT_P12" | base64 --decode >"$RUNNER_TEMP/corka.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/corka.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          existing=()
          while IFS= read -r line; do existing+=("$(echo "$line" | tr -d '" ')"); done < <(security list-keychains -d user)
          # Saved so the cleanup step can restore the runner user's own search list.
          printf '%s\n' "${existing[@]}" >"$RUNNER_TEMP/keychain-search-list"
          echo "CORKA_SIGNING_KEYCHAIN=$keychain" >>"$GITHUB_ENV"
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm -f "$RUNNER_TEMP/corka.p12"
          if ! security find-identity -v -p codesigning "$keychain" | grep -q "Corka Code Signing"; then
            echo "::error::This Mac does not trust the Corka signing certificate yet; trust it once (see the workflow header) and rerun."
            exit 1
          fi

      - name: Build app
        run: pnpm run build:release

      - name: Package and upload (macOS arm64)
        run: |
          set -euo pipefail
          node config/scripts/orcad-distribution/prebuilds/pinned-node-downloads.mjs darwin-arm64
          node config/scripts/native-build/node-addons/ensure-native-runtime.mjs --runtime=electron
          pnpm exec electron-builder --config config/electron-builder.config.cjs \
            --mac dmg zip --arm64 --publish always \
            -c.publish.releaseType=draft

      - name: Verify the app signature
        run: |
          set -euo pipefail
          app=$(find dist -maxdepth 2 -name Corka.app -type d | head -1)
          codesign --verify --deep --strict "$app"
          codesign -d -r- "$app" 2>&1 | grep 'designated =>'

      - name: Stamp the minimum macOS on the update manifest
        run: |
          set -euo pipefail
          node config/scripts/desktop-distribution/macos/gate-mac-update-manifests.mjs dist
          gh release upload "$TAG" dist/*-mac.yml --repo "$GITHUB_REPOSITORY" --clobber

      # A self-hosted Mac keeps state between runs: drop the signing keychain and restore the search list.
      - name: Remove the signing keychain
        if: always()
        run: |
          set -uo pipefail
          if [ -f "$RUNNER_TEMP/keychain-search-list" ]; then
            saved=()
            while IFS= read -r line; do saved+=("$line"); done <"$RUNNER_TEMP/keychain-search-list"
            security list-keychains -d user -s "${saved[@]}"
          fi
          if [ -n "${CORKA_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$CORKA_SIGNING_KEYCHAIN" || true
          fi

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      ORCA_BUILD_IDENTITY: stable
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Use external node-gyp to avoid pnpm's bundled copy
        run: |
          npm install -g node-gyp@11.5.0
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-builder-linux-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-linux-

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      - uses: ./.github/actions/install-mobile-dependencies

      - name: Install Linux computer-use provider dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-atspi-2.0 at-spi2-core xclip xdotool

      - name: Stamp the Corka version
        run: npm pkg set version="${{ needs.prepare.outputs.version }}"

      - name: Build app
        run: pnpm run build:release

      - name: Package and upload (Linux x64)
        run: |
          set -euo pipefail
          node config/scripts/native-build/node-addons/ensure-native-runtime.mjs --runtime=electron
          pnpm exec electron-builder --config config/electron-builder.config.cjs \
            --linux AppImage deb --x64 --publish always \
            -c.publish.releaseType=draft

  publish:
    needs: [prepare, build-mac, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The updater only offers a release whose latest-mac.yml and latest-linux.yml are both present.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for manifest in latest-mac.yml latest-linux.yml; do
            grep -qx "$manifest" <<<"$assets" || { echo "::error::$manifest missing from $TAG"; exit 1; }
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
