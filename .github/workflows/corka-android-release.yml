name: Corka Android Release

# Corka's phone app: tag `mobile-android-v<major>.<minor>.<app.json patch × 100 + build>` on `mine`,
# e.g. app.json 0.0.64 + build 1 → mobile-android-v0.0.6401. The phone's update check reads these
# releases (mobile/src/app-update/corka-release-repo.ts). Upstream's mobile-android-release.yml
# listens to the same tags; on `mine` its build job only runs on stablyai/orca.
on:
  push:
    tags:
      - 'mobile-android-v*'

concurrency:
  group: corka-android-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  android:
    if: github.repository != 'stablyai/orca'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve the Corka version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^mobile-android-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag $TAG is not mobile-android-v<major>.<minor>.<patch>"
            exit 1
          fi
          major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" patch="${BASH_REMATCH[3]}"
          base=$(node -p "require('./app.json').expo.version")
          IFS=. read -r base_major base_minor base_patch <<<"$base"
          if [ "$major" != "$base_major" ] || [ "$minor" != "$base_minor" ] || [ "$((patch / 100))" != "$base_patch" ] || [ "$((patch % 100))" -lt 1 ]; then
            echo "::error::Tag $TAG must be mobile-android-v$base_major.$base_minor.$((base_patch * 100 + 1)) to …$((base_patch * 100 + 99)) for app.json $base"
            exit 1
          fi
          version="$major.$minor.$patch"
          # The run number only grows, so every APK installs over the one before it.
          node -e '
            const fs = require("fs")
            const config = JSON.parse(fs.readFileSync("app.json", "utf8"))
            config.expo.version = process.argv[1]
            config.expo.android.versionCode = Number(process.argv[2]) + 100
            fs.writeFileSync("app.json", JSON.stringify(config, null, 2) + "\n")
          ' "$version" "$VERSION_CODE"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Decode release keystore
        env:
          ORCA_ANDROID_KEYSTORE_BASE64: ${{ secrets.ORCA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ORCA_ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Set the ORCA_ANDROID_KEYSTORE_* secrets; see the Android Release Signing section of mobile/README.md"
            exit 1
          fi
          umask 077
          printf '%s' "$ORCA_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/corka-release.keystore"

      - name: Build Android release APK
        env:
          ORCA_ANDROID_REQUIRE_RELEASE_SIGNING: 'true'
          ORCA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/corka-release.keystore
          ORCA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ORCA_ANDROID_KEYSTORE_PASSWORD }}
          ORCA_ANDROID_KEY_ALIAS: ${{ secrets.ORCA_ANDROID_KEY_ALIAS }}
          ORCA_ANDROID_KEY_PASSWORD: ${{ secrets.ORCA_ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/corka-release.keystore"

      # A swapped key would make every installed copy refuse the update.
      - name: Verify APK signing certificate
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ORCA_ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME"/build-tools -maxdepth 2 -name apksigner | sort -V | tail -1)"
          apks=(android/app/build/outputs/apk/release/*.apk)
          echo "Verifying ${apks[0]} with $apksigner"
          signers="$("$apksigner" verify --verbose --print-certs "${apks[0]}" 2>&1)"
          printf '%s\n' "$signers"
          certs="$(sed -n 's/^Signer.* certificate SHA-256 digest: //p' <<<"$signers" | sort -u)"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')"
          if [ -z "$expected" ] || [ "$certs" != "$expected" ]; then
            echo "::error::The APK signing certificate ($certs) does not match ORCA_ANDROID_RELEASE_CERT_SHA256 ($expected)."
            exit 1
          fi

      - name: Name and checksum the APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one release APK, found ${#apks[@]}" >&2
            exit 1
          fi
          apk="$RUNNER_TEMP/corka-$VERSION.apk"
          cp "${apks[0]}" "$apk"
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$apk")" | sed 's/  / */' > "$(basename "$apk").sha256")
          echo "apk=$apk" >>"$GITHUB_OUTPUT"

      # Prerelease and not latest, so the desktop updater's feed never picks a phone release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APK: ${{ steps.apk.outputs.apk }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "Corka Android $TAG" --notes "Corka for Android. Install the APK over the previous version." \
              --prerelease --latest=false
          fi
